name: Electron CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows-source-validation:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies and update the npm lockfile
        shell: bash
        run: |
          npm install --no-audit --no-fund
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: sync npm lockfile after vanilla renderer migration"
            git push
          fi
      - name: Check Electron and vanilla renderer source syntax
        shell: bash
        run: |
          node --check electron/main.cjs
          node --check electron/preload.cjs
          node --check electron/inference-worker.mjs
          node --check electron/inference-runtime-smoke-host.cjs
          node --check electron/startup-smoke.cjs
          for file in renderer/*.js renderer/pages/*.js; do node --check "$file"; done
      - name: Run persistence, GGUF, IPC contract and memory guard tests
        run: npm test
      - name: Verify prebuilt llama.cpp native runtime inside Electron
        run: npm run test:inference-runtime
      - name: Launch the complete Electron app and wait for renderer readiness
        run: npm run test:startup
      - name: Validate vanilla renderer
        run: npm run build
      - name: Package Windows installer
        run: npm run dist
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Sync-AI-Desktop-E-Windows-Installer
          path: release/Sync-AI-Desktop-E-Setup-0.1.0.exe
          if-no-files-found: error
          retention-days: 14
