name: Electron CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows-source-validation:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies and update the npm lockfile
        shell: bash
        run: |
          npm install --no-audit --no-fund
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: sync npm lockfile for native inference"
            git push
          fi
      - name: Check Electron main-process source syntax
        shell: bash
        run: |
          node --check electron/main.cjs
          node --check electron/preload.cjs
          node --check electron/inference-worker.mjs
          node --check electron/inference-runtime-smoke-host.cjs
      - name: Run persistence, GGUF, IPC contract and memory guard tests
        run: npm test
      - name: Verify prebuilt llama.cpp native runtime inside Electron
        run: npm run test:inference-runtime
      - name: Type-check and build renderer
        run: npm run build
